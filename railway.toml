# ==============================================
# Railway 배포 설정 — Ember Sentinel Server
# ==============================================

[build]
dockerfilePath = "Dockerfile.render"

[deploy]
healthcheckPath = "/actuator/health"
healthcheckTimeout = 60
startCommand = "java -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/./urandom -Dspring.profiles.active=render -jar /app/app.jar"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
